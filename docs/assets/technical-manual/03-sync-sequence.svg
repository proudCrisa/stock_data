    <!-- legend -->
    <line x1="48" y1="556" x2="944" y2="556" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="48" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">NOTE</text>
    <text x="96" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">end 不超过 latest_finalized_date()；停牌日无行不视为缺口；重跑天然幂等（覆盖区间 MIN/MAX 合并）。</text>
    <line x1="48" y1="592" x2="76" y2="592" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow3-accent)"/>
    <text x="84" y="595" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">主成功写</text>
    <line x1="172" y1="592" x2="200" y2="592" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow3-link)"/>
    <text x="208" y="595" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">外部 API</text>
    <line x1="292" y1="592" x2="320" y2="592" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow3)"/>
    <text x="328" y="595" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">返回</text>
