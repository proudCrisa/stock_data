    <rect x="440" y="64" width="112" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="440" y="64" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="448" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="464" y="81" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
    <text x="496" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">sync 引擎</text>
    <text x="496" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">缺口日历语义</text>

    <rect x="624" y="64" width="128" height="56" rx="6" fill="#f5f5f5"/>
