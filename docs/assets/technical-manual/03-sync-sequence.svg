    <text x="688" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">cache.sqlite</text>
    <text x="688" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">daily · coverage</text>

    <rect x="816" y="64" width="128" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="816" y="64" width="128" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <rect x="824" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
    <text x="838" y="81" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="880" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">baostock</text>
