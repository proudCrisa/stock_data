name: Provider Component Authority

on:
  workflow_dispatch:
    inputs:
      component:
        description: Provider component role
        required: true
        type: choice
        options:
          - trading_calendar
          - universe
          - instrument_status
          - corporate_actions
          - market_rules
      artifact_url:
        description: HTTPS URL of canonical component artifact
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of canonical component artifact
        required: true
        type: string
      source_receipt_urls:
        description: HTTPS URLs of individual canonical source receipts, separated by spaces
        required: true
        type: string
      source_receipt_sha256s:
        description: SHA-256 values matching source_receipt_urls, separated by spaces
        required: true
        type: string
      registry_url:
        description: HTTPS URL of enrolled trust registry
        required: true
        type: string
      registry_sha256:
        description: SHA-256 of enrolled trust registry
        required: true
        type: string
      effective_at:
        description: Canonical timezone-aware envelope effective time
        required: true
        type: string
      available_at:
        description: Canonical timezone-aware envelope availability
        required: true
        type: string
      publisher_key_id:
        description: SHA-256 publisher key ID of the signing key
        required: true
        type: string
      decision_cutoffs:
        description: Whitespace-separated PANEL=TIMESTAMP decision cutoff entries
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-component:
    environment: stockdata-provider-component-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install verifier dependencies
        run: python -m pip install --require-hashes -r .github/provider-authority-requirements.txt
      - name: Download pinned authority inputs
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          SOURCE_RECEIPT_URLS: ${{ inputs.source_receipt_urls }}
          SOURCE_RECEIPT_SHA256S: ${{ inputs.source_receipt_sha256s }}
          REGISTRY_URL: ${{ inputs.registry_url }}
          REGISTRY_SHA256: ${{ inputs.registry_sha256 }}
        run: |
          set -euo pipefail
          for value in "$ARTIFACT_SHA256" "$REGISTRY_SHA256"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          for value in "$ARTIFACT_URL" "$REGISTRY_URL"; do
            [[ "$value" =~ ^https:// ]]
          done
          [[ -n "$SOURCE_RECEIPT_URLS" ]]
          [[ -n "$SOURCE_RECEIPT_SHA256S" ]]
          read -r -a SOURCE_RECEIPT_URLS <<< "$SOURCE_RECEIPT_URLS"
          read -r -a SOURCE_RECEIPT_SHA256S <<< "$SOURCE_RECEIPT_SHA256S"
          [[ "${#SOURCE_RECEIPT_URLS[@]}" -gt 0 ]]
          [[ "${#SOURCE_RECEIPT_URLS[@]}" -eq "${#SOURCE_RECEIPT_SHA256S[@]}" ]]
          for value in "${SOURCE_RECEIPT_SHA256S[@]}"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          for value in "${SOURCE_RECEIPT_URLS[@]}"; do
            [[ "$value" =~ ^https:// ]]
          done
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$ARTIFACT_URL" -o "$RUNNER_TEMP/component.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$REGISTRY_URL" -o "$RUNNER_TEMP/registry.json"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$RUNNER_TEMP/component.json" | sha256sum --check --strict
          printf '%s  %s\n' "$REGISTRY_SHA256" "$RUNNER_TEMP/registry.json" | sha256sum --check --strict
          for index in "${!SOURCE_RECEIPT_URLS[@]}"; do
            receipt_file="$RUNNER_TEMP/source-receipt-$((index + 1)).json"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              "${SOURCE_RECEIPT_URLS[$index]}" -o "$receipt_file"
            printf '%s  %s\n' "${SOURCE_RECEIPT_SHA256S[$index]}" "$receipt_file" \
              | sha256sum --check --strict
          done
      - name: Sign and production-verify component authority
        env:
          COMPONENT: ${{ inputs.component }}
          REGISTRY_SHA256: ${{ inputs.registry_sha256 }}
          EFFECTIVE_AT: ${{ inputs.effective_at }}
          AVAILABLE_AT: ${{ inputs.available_at }}
          PUBLISHER_KEY_ID: ${{ inputs.publisher_key_id }}
          DECISION_CUTOFFS: ${{ inputs.decision_cutoffs }}
          SIGNER_PRIVATE_KEY_ENV: STOCKDATA_PROVIDER_PRIVATE_KEY_B64
          STOCKDATA_PROVIDER_PRIVATE_KEY_B64: ${{ secrets.STOCKDATA_PROVIDER_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_KEY_ID" =~ ^[0-9a-f]{64}$ ]]
          decision_cutoff_entries=()
          read -r -a decision_cutoff_entries <<< "$DECISION_CUTOFFS"
          [[ "${#decision_cutoff_entries[@]}" -gt 0 ]]
          decision_cutoff_args=()
          for cutoff in "${decision_cutoff_entries[@]}"; do
            decision_cutoff_args+=(--decision-cutoff "$cutoff")
          done
          source_receipt_args=()
          for receipt_file in "$RUNNER_TEMP"/source-receipt-*.json; do
            [[ -f "$receipt_file" ]]
            source_receipt_args+=(--source-receipt "$receipt_file")
          done
          [[ "${#source_receipt_args[@]}" -gt 0 ]]
          python -m stockdata.provider_authority_publisher publish-envelope \
            --component "$COMPONENT" \
            --registry "$RUNNER_TEMP/registry.json" \
            --registry-sha256 "$REGISTRY_SHA256" \
            --artifact "$RUNNER_TEMP/component.json" \
            "${source_receipt_args[@]}" \
            "${decision_cutoff_args[@]}" \
            --signer-private-key-env "$SIGNER_PRIVATE_KEY_ENV" \
            --output "$RUNNER_TEMP/${COMPONENT}-authority-envelope.json" \
            --effective-at "$EFFECTIVE_AT" \
            --available-at "$AVAILABLE_AT" \
            --publisher-key-id "$PUBLISHER_KEY_ID"
          sha256sum "$RUNNER_TEMP/${COMPONENT}-authority-envelope.json" \
            > "$RUNNER_TEMP/${COMPONENT}-authority-envelope.json.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-${{ inputs.component }}-authority-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/${{ inputs.component }}-authority-envelope.json
            ${{ runner.temp }}/${{ inputs.component }}-authority-envelope.json.sha256
          if-no-files-found: error
          retention-days: 30
