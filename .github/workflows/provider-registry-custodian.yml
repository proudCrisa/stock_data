name: Provider Registry Custodian

on:
  workflow_dispatch:
    inputs:
      root_public_key_url:
        description: HTTPS URL of the canonical Ed25519 root public key JSON
        required: true
        type: string
      root_public_key_sha256:
        description: SHA-256 of the canonical root public key JSON
        required: true
        type: string
      enrollment_url:
        description: HTTPS URL of the already root-signed signer enrollment JSON
        required: true
        type: string
      enrollment_sha256:
        description: SHA-256 of the root-signed signer enrollment JSON
        required: true
        type: string
      registry_version:
        description: Positive registry version
        required: true
        type: string

permissions:
  contents: read

jobs:
  enroll-publisher:
    environment: stockdata-provider-registry-custodian
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install verifier dependencies
        run: python -m pip install --require-hashes -r .github/provider-authority-requirements.txt
      - name: Download and verify pinned authority inputs
        env:
          ROOT_PUBLIC_KEY_URL: ${{ inputs.root_public_key_url }}
          ROOT_PUBLIC_KEY_SHA256: ${{ inputs.root_public_key_sha256 }}
          ENROLLMENT_URL: ${{ inputs.enrollment_url }}
          ENROLLMENT_SHA256: ${{ inputs.enrollment_sha256 }}
        run: |
          set -euo pipefail
          for value in "$ROOT_PUBLIC_KEY_SHA256" "$ENROLLMENT_SHA256"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          for value in "$ROOT_PUBLIC_KEY_URL" "$ENROLLMENT_URL"; do
            [[ "$value" =~ ^https:// ]]
          done
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$ROOT_PUBLIC_KEY_URL" -o "$RUNNER_TEMP/root-public-key.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$ENROLLMENT_URL" -o "$RUNNER_TEMP/root-signed-enrollment.json"
          printf '%s  %s\n' "$ROOT_PUBLIC_KEY_SHA256" "$RUNNER_TEMP/root-public-key.json" \
            | sha256sum --check --strict
          printf '%s  %s\n' "$ENROLLMENT_SHA256" "$RUNNER_TEMP/root-signed-enrollment.json" \
            | sha256sum --check --strict
      - name: Build and verify enrolled registry
        env:
          REGISTRY_VERSION: ${{ inputs.registry_version }}
        run: |
          set -euo pipefail
          [[ "$REGISTRY_VERSION" =~ ^[1-9][0-9]*$ ]]
          python -m stockdata.provider_authority_publisher build-registry \
            --root-public-key "$RUNNER_TEMP/root-public-key.json" \
            --enrollment "$RUNNER_TEMP/root-signed-enrollment.json" \
            --output "$RUNNER_TEMP/enrolled-trust-registry.json" \
            --registry-version "$REGISTRY_VERSION"
          sha256sum "$RUNNER_TEMP/enrolled-trust-registry.json" \
            > "$RUNNER_TEMP/enrolled-trust-registry.json.sha256"
          grep -Eq '^[0-9a-f]{64}  .+/enrolled-trust-registry.json$' \
            "$RUNNER_TEMP/enrolled-trust-registry.json.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enrolled-provider-trust-registry-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/enrolled-trust-registry.json
            ${{ runner.temp }}/enrolled-trust-registry.json.sha256
          if-no-files-found: error
          retention-days: 30
